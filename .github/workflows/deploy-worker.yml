name: Deploy leaderboard Worker

on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys/migrations against production at once
concurrency:
  group: leaderboard-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leaderboard
    env:
      # Account-scoped API token (Workers Scripts: Edit, D1: Edit) — see repo secrets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Uses the wrangler version pinned in leaderboard/package.json
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply keep-hands --remote

      # Existing secrets (RUN_SECRET) are kept; only code, bindings and vars are updated
      - name: Deploy
        run: npx wrangler deploy
